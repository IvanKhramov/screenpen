name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy -p screenpen -- -D warnings
      - run: cargo build --release -p screenpen
      - uses: actions/upload-artifact@v4
        with:
          name: screenpen-windows-x64
          path: target/release/screenpen.exe
  release:
    # Push a tag like v0.1.0-alpha.1 to publish the exe as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenpen-windows-x64
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv screenpen.exe "screenpen-$TAG-windows-x64.exe"
          flags="--generate-notes"
          case "$TAG" in *-*) flags="$flags --prerelease";; esac
          gh release create "$TAG" "screenpen-$TAG-windows-x64.exe" -R "$GITHUB_REPOSITORY" --title "$TAG" $flags
