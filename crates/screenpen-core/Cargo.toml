[package]
name = "screenpen-core"
description = "Model, geometry and rendering for screenpen (no OS dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cosmic-text = "0.19"
miniz_oxide = "0.8"
swash = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
tiny-skia.workspace = true

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
